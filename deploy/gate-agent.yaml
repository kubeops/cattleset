# The CattleSet gate agent. Install on EVERY Member spoke. Set --dc-name to this
# spoke's OCM managed cluster name, the same string the scope markers carry in
# activeDC. The agent holds no hub credential: a hub outage never blocks a
# legitimate admission nor forces a wrong one.
apiVersion: v1
kind: Namespace
metadata:
  name: cattleset-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cattleset-gate-agent
  namespace: cattleset-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cattleset-gate-agent
rules:
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch, patch, update]   # the herd's Services: selector and annotations
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]                  # does the database's local Service have a ready endpoint
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, patch]                  # the serving label, and the C3 fallback
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cattleset-gate-agent
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: cattleset-gate-agent }
subjects:
  - { kind: ServiceAccount, name: cattleset-gate-agent, namespace: cattleset-system }
---
# Read the scope markers dr-controlplane's agent projects on this spoke, and only those.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cattleset-gate-agent-markers
  namespace: dc-failover
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cattleset-gate-agent-markers
  namespace: dc-failover
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cattleset-gate-agent-markers }
subjects:
  - { kind: ServiceAccount, name: cattleset-gate-agent, namespace: cattleset-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cattleset-gate-agent-leader-election
  namespace: cattleset-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cattleset-gate-agent-leader-election
  namespace: cattleset-system
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: cattleset-gate-agent-leader-election }
subjects:
  - { kind: ServiceAccount, name: cattleset-gate-agent, namespace: cattleset-system }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cattleset-gate-agent
  namespace: cattleset-system
spec:
  replicas: 2                      # leader elected: one writes, the other takes over
  selector:
    matchLabels: { app.kubernetes.io/name: cattleset, app.kubernetes.io/component: gate-agent }
  template:
    metadata:
      labels: { app.kubernetes.io/name: cattleset, app.kubernetes.io/component: gate-agent }
    spec:
      serviceAccountName: cattleset-gate-agent
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: cattleset, app.kubernetes.io/component: gate-agent }
      containers:
        - name: gate-agent
          image: ghcr.io/kubeops/cattleset:latest   # pin a release tag
          args:
            - run
            - --hub-controller=false
            - --gate-agent=true
            - --dc-name=REPLACE-WITH-THIS-SPOKES-MANAGED-CLUSTER-NAME
            - --leader-elect=true
            - --leader-election-id=cattleset-gate-agent.k8s.appscode.com
            - --gate-resync=5s
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
          livenessProbe: { httpGet: { path: /healthz, port: 8081 } }
          readinessProbe: { httpGet: { path: /readyz, port: 8081 } }
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false, readOnlyRootFilesystem: true }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: cattleset-gate-agent
  namespace: cattleset-system
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: cattleset, app.kubernetes.io/component: gate-agent }
